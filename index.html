<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Emperor Bot - Successfully Deployed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        
        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .text-container {
            position: relative;
            z-index: 1;
            padding: 20px;
        }
        
        h1 {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            opacity: 0;
            transform: translateY(50px);
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8), 0 0 30px rgba(255, 0, 85, 0.4);
            animation: fadeIn 2s forwards 0.5s;
        }
        
        h2 {
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(50px);
            color: #bf00ff;
            text-shadow: 0 0 15px rgba(191, 0, 255, 0.6);
            animation: fadeIn 2s forwards 1s;
        }
        
        .bot-name {
            font-size: 3.8rem;
            color: #ff3300;
            text-shadow: 0 0 20px rgba(255, 51, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.5);
            display: block;
            margin-top: 1rem;
            opacity: 0;
            transform: scale(0.5);
            animation: zoomIn 2s forwards 2s;
            font-weight: bold;
        }
        
        .message {
            font-size: 1.3rem;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            color: #c5c5d2;
            opacity: 0;
            animation: fadeIn 3s forwards 3s;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(191, 0, 255, 0.08);
            box-shadow: 0 0 120px rgba(191, 0, 255, 0.15);
            animation: pulse 8s infinite alternate;
        }
        
        .circle:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -175px;
            left: -175px;
            animation-delay: 0s;
        }
        
        .circle:nth-child(2) {
            width: 550px;
            height: 550px;
            bottom: -275px;
            right: -275px;
            animation-delay: 1s;
            background: rgba(255, 0, 85, 0.08);
            box-shadow: 0 0 120px rgba(255, 0, 85, 0.15);
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes zoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.6;
            }
            100% {
                transform: scale(0.85);
                opacity: 0.5;
            }
        }
        
        @keyframes glow {
            0% {
                text-shadow: 0 0 15px rgba(255, 51, 0, 0.8);
            }
            50% {
                text-shadow: 0 0 25px rgba(255, 0, 85, 1), 0 0 40px rgba(191, 0, 255, 0.6);
            }
            100% {
                text-shadow: 0 0 15px rgba(255, 51, 0, 0.8);
            }
        }
        
        .completed {
            animation: glow 3s infinite;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            .bot-name {
                font-size: 2.4rem;
            }
            
            .message {
                font-size: 1.1rem;
                padding: 0 15px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            h2 {
                font-size: 1.3rem;
            }
            
            .bot-name {
                font-size: 1.7rem;
            }
            
            .message {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="circle"></div>
    <div class="circle"></div>
    
    <div class="container">
        <div class="text-container">
            <h1>Realm Awakened</h1>
            <h2>Deployment Successful</h2>
            <span class="bot-name">Demon Emperor Bot</span>
            <p class="message">The core systems have successfully established connection. The dominion of the Demon Emperor is now active and online across all realms.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: {
                        value: 70,
                        density: {
                            enable: true,
                            value_area: 800
                        }
                    },
                    color: {
                        value: "#ff0055"
                    },
                    shape: {
                        type: "circle",
                        stroke: {
                            width: 0,
                            color: "#000000"
                        }
                    },
                    opacity: {
                        value: 0.4,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 1,
                            opacity_min: 0.1,
                            sync: false
                        }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: {
                            enable: true,
                            speed: 2,
                            size_min: 0.3,
                            sync: false
                        }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#bf00ff",
                        opacity: 0.3,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 1.8,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: {
                            enable: false,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: true,
                            mode: "grab"
                        },
                        onclick: {
                            enable: true,
                            mode: "push"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 140,
                            line_linked: {
                                opacity: 0.8
                            }
                        },
                        push: {
                            particles_nb: 4
                        }
                    }
                },
                retina_detect: true
            });
            
            setTimeout(() => {
                document.querySelector('h1').classList.add('completed');
                document.querySelector('h2').classList.add('completed');
                document.querySelector('.bot-name').classList.add('completed');
            }, 5000);
        });
    </script>
</body>
</html>
